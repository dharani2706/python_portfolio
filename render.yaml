services:
  - type: web
    name: python-developer-portfolio
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn portfolio_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SITE_NAME
        value: Dharani
      - key: SITE_TITLE
        value: Python Developer / Django Developer
      - key: SITE_EMAIL
        value: dharani@example.com
      - key: SITE_GITHUB
        value: https://github.com/your-username
      - key: SITE_LINKEDIN
        value: https://www.linkedin.com/in/your-profile

databases:
  - name: portfolio-db
    plan: free
